name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 最小権限。CI はコードを読むだけで書き込みは行わない。
permissions:
  contents: read

env:
  # Wrangler の匿名テレメトリを無効化する
  WRANGLER_SEND_METRICS: "false"

jobs:
  quality:
    name: Lint / Format / Typecheck / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # --frozen-lockfile: bun.lock と package.json がズレていたら失敗させる
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      # apps/web は Vite ビルド、apps/api は wrangler の dry-run バンドル
      - name: Build
        run: bun run build

