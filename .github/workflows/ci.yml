name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 最小権限。CI はコードを読むだけで書き込みは行わない。
permissions:
  contents: read

env:
  # Wrangler の匿名テレメトリを無効化する
  WRANGLER_SEND_METRICS: "false"

jobs:
  quality:
    name: Lint / Format / Typecheck / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Cache Bun install cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # --frozen-lockfile: bun.lock と package.json がズレていたら失敗させる
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      # apps/web は Vite ビルド、apps/api は wrangler の dry-run バンドル
      - name: Build
        run: bun run build

  db-check:
    name: Drizzle schema / migration drift
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # generate はスキーマファイルの差分のみを見るため、実際のDBには接続しない。
      # dbCredentials の評価を通すためのダミー値。
      - name: Generate migration
        run: bun run db:generate
        env:
          DATABASE_URL: "postgresql://user:password@localhost:5432/dummy"

      - name: Fail if migrations are out of sync
        run: |
          if [ -n "$(git status --porcelain packages/db/drizzle/)" ]; then
            echo "::error::schema.ts の変更がマイグレーションに反映されていません。"
            git status --porcelain packages/db/drizzle/
            exit 1
          fi
